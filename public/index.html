<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>github-loc-counter — 算你的 GitHub 行數</title>
  <meta name="description" content="輸入任意 GitHub username，近似計算累積寫了多少行程式碼。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧮%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e;
      --accent: #58a6ff; --accent-2: #3fb950; --warn: #d29922; --err: #f85149;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fff; --panel: #f6f8fa; --border: #d0d7de;
        --text: #1f2328; --muted: #656d76;
        --accent: #0969da; --accent-2: #1a7f37; --warn: #9a6700;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; line-height: 1.5; }
    main { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }

    header h1 { font-size: 28px; margin: 0 0 4px; }
    header p { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
    header a { color: var(--accent); text-decoration: none; }

    .search {
      display: flex; gap: 8px; margin-bottom: 24px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px;
    }
    .search input {
      flex: 1; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 14px; font-size: 15px;
    }
    .search input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    .search button {
      background: var(--accent); color: white; border: 0; border-radius: 6px;
      padding: 0 18px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .search button:disabled { opacity: .6; cursor: wait; }
    .search .hint { color: var(--muted); font-size: 12px; padding: 4px 6px 0; }

    .examples { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 28px; font-size: 13px; }
    .examples span { color: var(--muted); }
    .examples a {
      color: var(--accent); cursor: pointer; text-decoration: none;
      background: var(--panel); border: 1px solid var(--border);
      padding: 2px 10px; border-radius: 12px;
    }
    .examples a:hover { border-color: var(--accent); }

    .notice {
      background: var(--panel); border-left: 3px solid var(--warn);
      padding: 12px 16px; border-radius: 6px; margin-bottom: 20px;
      font-size: 13px; color: var(--muted);
    }
    .notice strong { color: var(--text); }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; }
    .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
    .stat .value { font-size: 28px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .stat .value.accent { color: var(--accent); }
    .stat .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

    .chart-card { background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .chart-card h2 { font-size: 16px; margin: 0 0 16px; }
    .chart-wrap { position: relative; height: 280px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }

    .error {
      background: var(--panel); border-left: 3px solid var(--err);
      color: var(--err); padding: 14px 18px; border-radius: 6px; margin-bottom: 20px;
    }
    .loading { text-align: center; color: var(--muted); padding: 40px; }
    .loading::after {
      content: '⏳'; display: inline-block; margin-left: 8px;
      animation: spin 2s linear infinite;
    }
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

    footer { color: var(--muted); font-size: 12px; margin-top: 40px; text-align: center; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🧮 github-loc-counter</h1>
      <p>輸入 GitHub username，看他累積寫了多少行程式碼（<a href="https://github.com/MAXXTANG/github-loc-counter">原始碼</a>）</p>
    </header>

    <form class="search" id="search-form">
      <input type="text" id="username-input" placeholder="GitHub username (e.g., MAXXTANG)"
             autocomplete="off" spellcheck="false" required
             pattern="[a-zA-Z0-9][a-zA-Z0-9\-]{0,38}">
      <button type="submit" id="submit-btn">查詢</button>
    </form>

    <div class="examples">
      <span>試試：</span>
      <a data-user="MAXXTANG">MAXXTANG</a>
      <a data-user="torvalds">torvalds</a>
      <a data-user="gaearon">gaearon</a>
      <a data-user="sindresorhus">sindresorhus</a>
    </div>

    <!-- Cloudflare Turnstile：防止濫用 GitHub API 額度 -->
    <div id="turnstile-container" style="margin-bottom:20px;">
      <div class="cf-turnstile"
           data-sitekey="0x4AAAAAADYkroWvRgoEnE_o"
           data-callback="onTurnstileSuccess"
           data-error-callback="onTurnstileError"
           data-theme="auto"></div>
    </div>

    <div id="result"></div>

    <footer>
      Powered by GitHub <code>/languages</code> API + Cloudflare Pages · 想要精確值？看
      <a href="https://github.com/MAXXTANG/maxxtang-loc">maxxtang-loc</a>（每月 tokei 快照）
      <br><br>
      <small style="color:var(--muted);line-height:1.6">
        ⚠️ 本工具僅讀取 GitHub 公開資料、近似誤差 ±15%，<strong>不代表程式能力評估</strong>。
        若不想被列入查詢結果，請寄信至 hanjourney@gmail.com 加入 blocklist。
      </small>
    </footer>
  </main>

  <script>
  const form = document.getElementById('search-form');
  const input = document.getElementById('username-input');
  const btn = document.getElementById('submit-btn');
  const result = document.getElementById('result');

  let activeChart1, activeChart2;
  let turnstileToken = null;

  // Turnstile callbacks（widget 用 data-callback 呼叫）
  window.onTurnstileSuccess = (token) => {
    turnstileToken = token;
  };
  window.onTurnstileError = () => {
    turnstileToken = null;
    result.innerHTML = `<div class="error">⚠️ Turnstile 驗證失敗，重新整理頁面再試</div>`;
  };

  document.querySelectorAll('.examples a').forEach(a => {
    a.addEventListener('click', () => { input.value = a.dataset.user; form.requestSubmit(); });
  });

  // 從 URL hash 直接查詢：#user=torvalds
  // 等 Turnstile token ready 才 submit，避免 1.5s timeout race
  const hashUser = new URLSearchParams(location.hash.slice(1)).get('user');
  if (hashUser) {
    input.value = hashUser;
    const waitToken = setInterval(() => {
      if (turnstileToken) { clearInterval(waitToken); form.requestSubmit(); }
    }, 200);
    // 安全上限 20 秒
    setTimeout(() => clearInterval(waitToken), 20000);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = input.value.trim();
    if (!user) return;
    location.hash = `user=${user}`;
    await query(user);
  });

  async function query(user) {
    // 等 Turnstile token（首次載入時 widget 可能還沒回呼）
    if (!turnstileToken) {
      result.innerHTML = `<div class="loading">等待 Turnstile 驗證完成…</div>`;
      for (let i = 0; i < 30 && !turnstileToken; i++) {
        await new Promise(r => setTimeout(r, 200));
      }
      if (!turnstileToken) {
        result.innerHTML = `<div class="error">Turnstile 沒回應，請重新整理頁面</div>`;
        return;
      }
    }

    btn.disabled = true;
    btn.textContent = '查詢中…';
    result.innerHTML = `<div class="loading">正在掃描 ${user} 的所有 repo</div>`;
    if (activeChart1) { activeChart1.destroy(); activeChart1 = null; }
    if (activeChart2) { activeChart2.destroy(); activeChart2 = null; }

    try {
      const r = await fetch(`/api/loc/${encodeURIComponent(user)}`, {
        headers: { 'X-Turnstile-Token': turnstileToken },
      });
      const data = await r.json();
      if (!r.ok) {
        result.innerHTML = `<div class="error">❌ ${data.error || 'unknown error'}</div>`;
        return;
      }
      render(data);
    } catch (err) {
      result.innerHTML = `<div class="error">❌ ${err.message}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = '查詢';
      // Turnstile token 是 one-shot，用過要重置 widget 拿下一張
      turnstileToken = null;
      if (window.turnstile) window.turnstile.reset();
    }
  }

  function render(data) {
    const fmt = n => Number(n || 0).toLocaleString();
    const langs = Object.entries(data.by_language || {})
      .map(([k, v]) => ({ name: k, lines: v }))
      .filter(l => l.lines > 0)
      .sort((a, b) => b.lines - a.lines);
    const topLangs = langs.slice(0, 10);

    const repos = Object.entries(data.by_repo || {})
      .map(([k, v]) => ({ name: k, lines: v.lines, stars: v.stars }))
      .sort((a, b) => b.lines - a.lines)
      .slice(0, 10);

    const cacheTag = data.cache === 'hit'
      ? '<span style="color:var(--accent-2)">⚡ from cache</span>'
      : '<span style="color:var(--muted)">fresh scan</span>';

    result.innerHTML = `
      <div class="notice">
        <strong>近似值</strong> · 用 GitHub <code>/languages</code> 回傳的 bytes 換算，誤差約 ±15%。
        ${cacheTag} · 24h 內重複查詢免費（cache hit ~10ms）。
      </div>

      <div class="stats">
        <div class="stat">
          <div class="label">Total Lines（≈）</div>
          <div class="value accent">${fmt(data.total_lines)}</div>
          <div class="sub">${fmt(data.total_code_lines)} 程式碼 · ${fmt(data.total_data_lines)} 資料/文件</div>
        </div>
        <div class="stat">
          <div class="label">Repos</div>
          <div class="value">${data.repo_count}</div>
          <div class="sub">非 fork、非 archived</div>
        </div>
        <div class="stat">
          <div class="label">Languages</div>
          <div class="value">${langs.length}</div>
          <div class="sub">${topLangs[0]?.name || '–'} 最多</div>
        </div>
        <div class="stat">
          <div class="label">User</div>
          <div class="value" style="font-size:20px;">
            <a href="https://github.com/${data.username}" target="_blank" style="color:var(--accent);text-decoration:none">@${data.username}</a>
          </div>
          <div class="sub">${new Date(data.generated_at).toLocaleString()}</div>
        </div>
      </div>

      <div class="grid-2">
        <div class="chart-card">
          <h2>語言分佈 Top 10</h2>
          <div class="chart-wrap"><canvas id="lang-chart"></canvas></div>
        </div>
        <div class="chart-card">
          <h2>Repo 排行 Top 10</h2>
          <div class="chart-wrap"><canvas id="repo-chart"></canvas></div>
        </div>
      </div>
    `;

    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const muted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();
    const border = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
    Chart.defaults.color = muted;
    Chart.defaults.borderColor = border;
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
    const palette = ['#58a6ff','#3fb950','#d29922','#bc8cff','#f85149','#39c5cf','#ff7b72','#a5d6ff','#7ee787','#ffa657'];

    activeChart1 = new Chart(document.getElementById('lang-chart'), {
      type: 'doughnut',
      data: {
        labels: topLangs.map(l => l.name),
        datasets: [{ data: topLangs.map(l => l.lines), backgroundColor: palette, borderWidth: 1 }]
      },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right', labels: { boxWidth: 12 } } } }
    });

    activeChart2 = new Chart(document.getElementById('repo-chart'), {
      type: 'bar',
      data: {
        labels: repos.map(r => r.name),
        datasets: [{ label: 'Lines (≈)', data: repos.map(r => r.lines), backgroundColor: accent }]
      },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { ticks: { callback: v => v.toLocaleString() } } } }
    });
  }
  </script>
</body>
</html>
